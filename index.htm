<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTracker - Weight History</title>
    <!-- Tailwind CSS CDN for instant, premium look -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">HealthTracker</h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">First Test • Weight History</p>
        </div>
        
        <!-- Table Container -->
        <div class="overflow-hidden border border-slate-100 rounded-xl">
            <table class="min-w-full divide-y divide-slate-100">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Date</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Time</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Weight</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white">
                    <!-- Mock Data -->
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-4 py-3.5 text-sm text-slate-700 font-medium">Nov 22, 2026</td>
                        <td class="px-4 py-3.5 text-sm text-slate-400">08:30 AM</td>
                        <td class="px-4 py-3.5 text-sm font-bold text-slate-800">74.5 kg</td>
                    </tr>
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-4 py-3.5 text-sm text-slate-700 font-medium">Nov 20, 2026</td>
                        <td class="px-4 py-3.5 text-sm text-slate-400">08:15 AM</td>
                        <td class="px-4 py-3.5 text-sm font-bold text-slate-800">74.8 kg</td>
                    </tr>
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-4 py-3.5 text-sm text-slate-700 font-medium">Nov 18, 2026</td>
                        <td class="px-4 py-3.5 text-sm text-slate-400">08:45 AM</td>
                        <td class="px-4 py-3.5 text-sm font-bold text-slate-800">75.2 kg</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Spark Plan Tag -->
        <div class="mt-6 flex items-center justify-between">
            <span class="inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-medium text-emerald-700 ring-1 ring-inset ring-emerald-600/10">
                Spark Plan (No-Cost Tier)
            </span>
            <span class="text-xs text-slate-400">Hosted via Firebase</span>
        </div>
    </div>
</body>
</html>
